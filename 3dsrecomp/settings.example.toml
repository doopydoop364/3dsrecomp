# Copy to settings.toml (in the folder you run the game from) and edit. Per-game defaults live in
# games/<title id>.toml; values here override them, and command-line flags (--scale 2, --set video.layout=stacked,
# see --help) override both.
# Key names are SDL key names: letters, "Up", "Down", "Left", "Right", "Return", "Backspace",
# "Space", "-", "=", "Left Shift", "Right Shift", "Tab", "1".."9", "F1".. and so on.

[controls]
# face buttons as a diamond like the 3DS: X top (I), Y left (J), A right (L), B bottom (K)
a = "L"
b = "K"
x = "I"
y = "J"
l = "Q"
r = "E"
start = "="
select = "-"
# circle pad (movement)
circle_up = "W"
circle_down = "S"
circle_left = "A"
circle_right = "D"
# d-pad
dpad_up = "Up"
dpad_down = "Down"
dpad_left = "Left"
dpad_right = "Right"
# gamepad face buttons: "nintendo" (by position: the right button is A) or "xbox" (by label: the button marked A is A)
gamepad_layout = "nintendo"
# New 3DS only (games that use them): ZL / ZR and the C-stick; on a gamepad the triggers and the right stick
zl = "1"
zr = "2"
cstick_up = "T"
cstick_down = "G"
cstick_left = "F"
cstick_right = "H"
# fast-forward while held (or press to toggle with fast_forward_mode = "toggle")
fast_forward = "Tab"
fast_forward_mode = "hold"

[video]
# stacked (like the console), large_top (bottom screen as a corner overlay),
# top_only (bottom screen shown while F3 is held), side_by_side
layout = "stacked"
fullscreen = false
# vulkan (GPU, falls back to software if Vulkan 1.3 is missing) or software
renderer = "vulkan"
# "mailbox" (no tearing, lowest latency), "on" (classic vsync: steadiest with FreeSync / G-SYNC), "off"
vsync = "mailbox"
# frame cap: 60 is normal speed. 3DS games tie their speed to their frame rate, so a higher cap (90, 120, 144, 240,
# "unlimited") makes the game run faster, not smoother; 30 runs it at half speed
frame_cap = 60
# window drawing: vulkan (fast, needed for anti-aliasing; falls back to sdl automatically) or sdl
present = "vulkan"
# anti-aliasing for the 3D screen (Vulkan window): off or fxaa
antialias = "off"
# Vulkan texture sampling: console (the game's own filtering and mipmaps, like a real 3DS), nearest (the
# reference software renderer's look), linear (smooth everything; can blur pixel-art UI)
texture_filter = "console"
# anisotropic filtering for textures the game smooths (1 = off, like the console; 2, 4, 8 or 16 = sharper at angles)
anisotropy = 1
# internal resolution for 3D (Vulkan): 1 = native 400x240, 2, 3 or 4 = sharper
scale = 1
# frame-rate counter (F9 toggles): game frames per second and window frames per second
show_fps = false

# Hotkeys: F1 next layout, F2 swap screens, F3 show bottom screen (top_only), F11 fullscreen,
# F12 screenshot, Escape quit. Gamepads use the Nintendo button positions automatically.

[input]
# use a gamepad's motion sensors (DualSense, DualShock 4, Switch Pro, Joy-Con) as the 3DS gyroscope/accelerometer
motion = true

[audio]
enabled = true
volume = 100   # percent

[hotspots]
# hold a key to touch a point on the bottom screen (320x240, origin top left), e.g.
# F7 = "160,200"
